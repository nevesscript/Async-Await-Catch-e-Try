
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Séries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1> <img src="icons8-netflix-30.png" alt="Ícone do Netflix" class="img">Buscar Séries</h1>
        <p>Encontre informações sobre suas séries favoritas.</p>

        <div class="pesquisa">
            <input 
                id="inputSerie" 
                placeholder="Digite o nome de uma série..."
            >
            <button id="btnBuscar">Buscar</button>
        </div>

        <p id="mensagem"></p>

        <section id="resultados" class="resultados">
            <!-- Seus resultados aparecerão aqui -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
